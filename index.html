<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palma Rosa Residence — Appartamenti a Milano, Città Studi</title>
    <meta
      name="description"
      content="Appartamenti con bagno privato in un edificio nuovo a Milano, Città Studi — vicino al Politecnico e alla metro M2. Wi-Fi, lavanderia e ascensore."
    />
    <link rel="canonical" href="https://palma-rosa-residence.vercel.app/" />

    <!-- Open Graph — controls the preview card shown when the link is shared on
         WhatsApp, Telegram, Facebook, iMessage, etc. og:image MUST be an
         absolute URL to a publicly reachable file (1200×630). -->
    <meta property="og:site_name" content="Palma Rosa Residence" />
    <meta property="og:title" content="Palma Rosa Residence — Appartamenti a Milano, Città Studi" />
    <meta
      property="og:description"
      content="Appartamenti con bagno privato in un edificio nuovo, vicino al Politecnico e alla metro M2. Wi-Fi, lavanderia e ascensore."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://palma-rosa-residence.vercel.app/" />
    <meta property="og:image" content="https://palma-rosa-residence.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Palma Rosa Residence, Milano" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter / X large card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Palma Rosa Residence — Appartamenti a Milano, Città Studi" />
    <meta
      name="twitter:description"
      content="Appartamenti con bagno privato in un edificio nuovo, vicino al Politecnico e alla metro M2."
    />
    <meta name="twitter:image" content="https://palma-rosa-residence.vercel.app/og-image.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Hero image: above-the-fold, preload so first paint isn't blocked
         waiting for the browser to discover the <img> deep in the React tree.
         Preloads the responsive WebP set (what <Picture> actually renders) so
         we don't double-download the JPG fallback. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/images/building/hero-480w.webp 480w, /images/building/hero-768w.webp 768w, /images/building/hero-1200w.webp 1200w, /images/building/hero-1920w.webp 1920w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <!-- Speed up Fontshare + Google Fonts handshake. -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>html, body { min-height: 100%; margin: 0; } #root { min-height: 100%; }</style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
