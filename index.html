<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palma Rosa Residence</title>
    <meta name="description" content="Appartamenti con bagno privato a Palma Rosa Residence, Milano Citta Studi." />
    <meta property="og:title" content="Palma Rosa Residence" />
    <meta property="og:description" content="Appartamenti con bagno privato vicino alla M2 a Milano." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Hero image: above-the-fold, preload so first paint isn't blocked
         waiting for the browser to discover the <img> deep in the React tree.
         Preloads the responsive WebP set (what <Picture> actually renders) so
         we don't double-download the JPG fallback. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/images/building/hero-480w.webp 480w, /images/building/hero-768w.webp 768w, /images/building/hero-1200w.webp 1200w, /images/building/hero-1920w.webp 1920w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <!-- Speed up Fontshare + Google Fonts handshake. -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>html, body { min-height: 100%; margin: 0; } #root { min-height: 100%; }</style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
