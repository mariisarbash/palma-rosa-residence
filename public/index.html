<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apartments Milano Città Studi</title>
  <meta name="description" content="Browse available apartments for rent in Milano. Check availability and get in touch instantly via WhatsApp.">

  <!-- Open Graph -->
  <meta property="og:title" content="Apartments Milano Città Studi">
  <meta property="og:description" content="Find your next home in Milano. Check availability and contact directly.">
  <meta property="og:type" content="website">

  <!-- Fonts -->
  <link rel="stylesheet" href="css/style.css?v=9">
</head>
<body>

  <!-- ─── Header ─────────────────────────────────────────── -->
  <header class="site-header">
    <div class="container">
      <span class="site-logo">Apartments Milano <span>Città Studi</span></span>
      <label class="lang-switch" for="language-switch">
        <span class="lang-switch__label" id="language-label">Language</span>
        <select id="language-switch" class="lang-switch__select" aria-label="Language selector">
          <option value="en">English</option>
          <option value="it">Italiano</option>
        </select>
      </label>
    </div>
  </header>

  <!-- ─── Hero + Search ──────────────────────────────────── -->
  <section class="hero">
    <div class="container">
      <p class="hero__eyebrow" id="hero-eyebrow">Milano</p>
      <h1 class="hero__title" id="hero-title">Find your perfect apartment</h1>
      <p class="hero__sub" id="hero-sub">Select your dates to see what's available.</p>

      <div class="search-bar" role="search">
        <div class="search-field">
          <label for="check-in" id="label-check-in">Check-in</label>
          <div class="date-input-control">
            <input type="date" id="check-in" aria-label="Check-in">
          </div>
        </div>

        <div class="search-field">
          <label for="check-out" id="label-check-out">Check-out</label>
          <div class="date-input-control">
            <input type="date" id="check-out" aria-label="Check-out">
          </div>
        </div>

        <button class="btn-search" id="btn-search" disabled data-default-label="Check Availability">
          Check Availability
        </button>
      </div>
    </div>
  </section>

  <!-- ─── Apartments Grid ─────────────────────────────────── -->
  <main class="apartments-section">
    <div class="container">
      <div class="section-head">
        <h2 id="apartments-title">Apartments</h2>
        <span class="apt-count" id="apartments-count">11 listings</span>
      </div>

      <!-- Cards are injected here by app.js -->
      <div class="apartments-grid" id="apartments-grid" role="list" aria-label="Apartments">
        <!-- Loading state will show placeholder cards via JS -->
      </div>
    </div>
  </main>

  <!-- ─── Modal Overlay ──────────────────────────────────── -->
  <div id="modal-overlay" role="presentation" aria-hidden="true"></div>

  <!-- ─── Footer ─────────────────────────────────────────── -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Apartments Milano Città Studi. <span id="footer-text">All rights reserved.</span></p>
    </div>
  </footer>

  <!-- Scripts (order matters: config → availability → modal → app) -->
  <script src="js/config.js?v=12"></script>
  <script src="js/availability.js?v=8"></script>
  <script src="js/modal.js?v=9"></script>
  <script src="js/app.js?v=8"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
